[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "busybar-tools"
version = "0.8.0"
description = "CLI tools to manage BUSY Bar"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [ {name = "Lesha Lomalkin"} ]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent"
]
dependencies = [
  "pyusb>=1.2,<2",
  "libusb-package>=1.0,<2",
  "typer>=0.27,<0.28",
]

[project.optional-dependencies]
test = ["pytest>=7"]
dev = [
  "pytest>=7",
  "pytest-cov>=4",
  "ruff>=0.9",
  "mypy>=1.8",
]

[project.scripts]
busybar = "busybar_tools.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
exclude = ["build*", "dist*", "tests*"]

[project.urls]
Homepage = "https://github.com/lomalkin/busybar-tools"
Issues = "https://github.com/lomalkin/busybar-tools/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "hardware: requires a live connected device (run with --run-hardware)",
  "flash: reflashes/reboots or overwrites the recovery partition (run with --run-flash)",
  "flash_final: destructive finalizer that runs last (factory reset); run with --run-flash",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_configs = true
