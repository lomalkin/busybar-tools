[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "busybar-tools"
version = "0.8.0"
description = "CLI tools to manage BUSY Bar"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [ {name = "Lesha Lomalkin"} ]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent"
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]
completion = ["argcomplete>=3"]

[project.scripts]
busybar = "busybar_tools.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]

[project.urls]
Homepage = "https://github.com/lomalkin/busybar-tools"
Issues = "https://github.com/lomalkin/busybar-tools/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "hardware: requires a live connected device (run with --run-hardware)",
  "flash: reflashes/reboots or overwrites the recovery partition (run with --run-flash)",
  "flash_final: destructive finalizer that runs last (factory reset); run with --run-flash",
]
